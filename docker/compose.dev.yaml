name: palanotes-dev

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: palanotes
      POSTGRES_PASSWORD: palanotes
      POSTGRES_DB: palanotes
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
