name: CI

# Pull requests run every job. A push to dev or main comes after a merged pull request whose
# tree was already tested, so it only runs `checks`.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node scripts/check-private-files.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: palanotes
          POSTGRES_PASSWORD: palanotes
          POSTGRES_DB: palanotes_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U palanotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://palanotes:palanotes@localhost:5434/palanotes_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: palanotes
          POSTGRES_PASSWORD: palanotes
          POSTGRES_DB: palanotes_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U palanotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palanotes/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # Builds the production images and starts the stack. Like the tests, it runs on pull requests:
  # the push after a merge carries a tree this job has already built.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env && cp .env.worker.example .env.worker
      - run: docker network create proxy
      - run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - run: POSTGRES_PASSWORD=ci docker compose build
      - name: Worker image has the pinned Claude Code CLI
        run: docker run --rm --entrypoint claude palanotes-worker:local --version
      - name: Stack starts and the migrations run
        run: |
          printf 'POSTGRES_PASSWORD=ci\nSESSION_SECRET=ci-session-secret-that-is-long-enough\nPUBLIC_URL=http://localhost\nOIDC_ISSUER=http://localhost/issuer\nOIDC_CLIENT_ID=ci\nOIDC_CLIENT_SECRET=ci\nOIDC_REDIRECT_URI=http://localhost/notes/api/auth/callback\n' > .env
          POSTGRES_PASSWORD=ci docker compose up -d --wait --wait-timeout 180
          docker compose ps
          docker compose logs migrate | grep 'migrations applied'
          docker compose exec -T web sh -c '[ -z "${CLAUDE_CODE_OAUTH_TOKEN+set}" ] && [ -z "${ANTHROPIC_API_KEY+set}" ]'
          docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/notes/api/health').then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1); })"
      - if: always()
        run: docker compose logs --no-color | tail -100
