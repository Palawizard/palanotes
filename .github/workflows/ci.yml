name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: palanotes
          POSTGRES_PASSWORD: palanotes
          POSTGRES_DB: palanotes_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U palanotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://palanotes:palanotes@localhost:5434/palanotes_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node scripts/check-private-files.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: palanotes
          POSTGRES_PASSWORD: palanotes
          POSTGRES_DB: palanotes_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U palanotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palanotes/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker network create proxy
      - run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - run: POSTGRES_PASSWORD=ci docker compose build
      - name: Worker image has the pinned Claude Code CLI
        run: docker run --rm --entrypoint claude palanotes-worker:local --version
      - name: Stack starts and the migrations run
        run: |
          printf 'POSTGRES_PASSWORD=ci\nSESSION_SECRET=ci-session-secret-that-is-long-enough\nPUBLIC_URL=http://localhost\nOIDC_ISSUER=http://localhost/issuer\nOIDC_CLIENT_ID=ci\nOIDC_CLIENT_SECRET=ci\nOIDC_REDIRECT_URI=http://localhost/notes/api/auth/callback\n' > .env
          POSTGRES_PASSWORD=ci docker compose up -d --wait --wait-timeout 180
          docker compose ps
          docker compose logs migrate | grep 'migrations applied'
          docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/notes/api/health').then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1); })"
      - if: always()
        run: docker compose logs --no-color | tail -100
